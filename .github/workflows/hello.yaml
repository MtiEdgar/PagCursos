name: Crear Pull Request

on:
  push:
    branches:
      - prog1
      - prog2

jobs:
  crear-pr:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Verificar si ya existe un Pull Request
        id: verificar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR=$(gh pr list \
            --base main \
            --head ${{ github.ref_name }} \
            --state open \
            --json number \
            --jq 'length')

          echo "existe=$PR" >> "$GITHUB_OUTPUT"

      - name: Crear Pull Request
        if: steps.verificar.outputs.existe == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head ${{ github.ref_name }} \
            --title "PR: ${{ github.ref_name }} → main" \
            --body "Pull Request creado automáticamente por GitHub Actions."
