# Test de pruebas unitarias
# github.com/marketplace 

name: Prueba_automatica

on:
  push:
    branches:
      - prog2

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
      # github.com/actions el checkout es para verificar la version del repositorio y poder hacer pruebas unitarias
      # https://github.com/marketplace/actions/checkout
        uses: actions/checkout@v7

# test: evalua una condicion y -f Comprueba que la ruta exista y corresponda a un archivo regular.
      - name: Verify index.html
        run: |
          echo "Verificando index.html..."
          test -f index.html
          echo "index.html encontrado."

      - name: Verify styles.css
        run: |
          echo "Verificando styles.css..."
          test -f styles/styles.css
          echo "styles.css encontrado."

# echo es para imprimir mensaje de texto en pantalla 
# grep busca patron de texto en un archivo
# -q es modo silencioso, no imprime nada en pantalla
# -i Ignora mayúsculas y minúsculas
      - name: Verify HTML structure
        run: |
          echo "Verificando estructura HTML..."
          grep -qi "<html" index.html
          grep -qi "<head" index.html
          grep -qi "<body" index.html

          echo "Estructura HTML basica correcta."

# grep -q Busca un texto y comunica si lo encontró mediante un código de salida.
      - name: Verify CSS reference
        run: |
          echo "Verificando referencia a styles.css..."
          grep -q 'styles/styles.css' index.html
          echo "Referencia a styles.css encontrada."